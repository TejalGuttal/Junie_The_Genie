# Camera configuration
camera.index=0
camera.fps=15

# Detection parameters (used if Haar cascades are present)
detect.smileThreshold=1.3
detect.minNeighbors=5
detect.fast=true
# Minimum time (ms) before allowing a mood switch (helps avoid flicker)
detect.minSwitchMs=250
# If a different mood is detected in this many consecutive frames, override the
# minSwitch timer and switch immediately for snappier response
detect.consecutiveOverride=2

# Mood to music path mapping (set full paths to your WAV/AIFF files)
# IMPORTANT: Set different song files for each mood so they sound distinct.
# Supported best: WAV/AIFF. MP3 may not play with default Java Sound.
mood.happy=
mood.neutral=
mood.calm=
mood.sad=

# Note: Place optional Haar cascade XML files under src/main/resources/cascades/
# Example filenames (OpenCV defaults):
#  - haarcascade_frontalface_default.xml
#  - haarcascade_smile.xml

# UI
# Show a live camera preview window while detecting mood
ui.preview=true

# Notes about audio fallback:
# If a mood.* file path is not set or fails to play, the app plays a synthesized rhythm
# that is DIFFERENT per mood (unique tempo/pattern/instrument mix). This ensures each
# emotion has a distinct sound even without real songs configured.
